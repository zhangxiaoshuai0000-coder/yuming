proxy-groups:
  - name: "节点选择"
    type: select
    proxies:
      - "🇯🇵 日本 01"
      - "美国01"
      - "美国02"
      - "美国04"
      - "美国09"
      - DIRECT
  - name: "自动选择"
    type: url-test
    url: http://cp.cloudflare.com/generate_204
    interval: 300
    tolerance: 50
    proxies:
      - "🇯🇵 日本 01"
      - "美国01"
      - "美国02"
      - "美国04"
      - "美国09"

rules:
  - GEOIP,LAN,DIRECT
  - GEOIP,CN,DIRECT
  - MATCH,节点选择
