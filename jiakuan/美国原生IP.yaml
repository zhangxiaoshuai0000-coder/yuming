    type: vless
    server: 137.175.82.40
    port: 30556
    uuid: 949d278e-6d98-4014-84e9-59f1c6c93e0e
    flow: xtls-rprx-vision
    network: tcp
    tls: true
    udp: true
    servername: www.lovelive-anime.jp
