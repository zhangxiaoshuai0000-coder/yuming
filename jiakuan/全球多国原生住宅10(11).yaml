        # END managed service DNS
        # 2026-07-23 infra 引导 (yuelink dns_policy_catalog 上移): geo 规则镜像 + updater
        # CDN 的解析不能依赖 DoH(443)/DoT(853) —— 443 被 QoS 限速 + 853 被封的网络上,
        # rule-provider 启动拉取会死锁 (解析镜像域名要走还没加载完的规则引擎)。这条键
        # 之所以赢是因为它排在兜底**前面** (matchPolicy 首个命中即返回, 没有具体度
        # 排序), plain-UDP:53 打头 (几乎所有网络可达), 健康网络 DoH 竞速
        # 胜出无泄漏。只放中性域 (R2+CF 分发), 不放品牌域。2026-10-05 起它们路由上走
        # 「悦通服务」(代理优先), 这条引导只在回落 DIRECT 时起作用。
        # 2026-10-05: 订阅源 sso 并入同一条引导 (exact, 不放宽 yuetoto.com)。路由上三者都走
        # 「悦通服务」(代理优先); 这条只保证代理全挂、回落 DIRECT 时仍能在 443/853 被打的
        # 网络上解析。key 与 yuelink dns_policy_catalog.dart 的 infraBootstrapDomains
        # (v1.3.113 起含 sso) 逐字同序, 客户端 ensure pass 才是 no-op。
        "sso.yuetoto.com,+.yuetong.app,+.xn--jdu596h.com":
            - "223.5.5.5"
            - "119.29.29.29"
            - "https://dns.alidns.com/dns-query"
        # 2026-09-08 源头修复: 苹果 / iCloud 走境内 DNS。
        # 🚨 这条此前**整个模板里根本没有**，而 apple.com / www.apple.com /
        # gsp-ssl.ls.apple.com / icloud.com 全都落在下面的非国内兜底里（实测对真实
        # geosite / notcn 数据核过），于是苹果域名一直由境外解析器回答——境外解析器
        # 没有理由返回国内的苹果边缘，表现是 App Store / iCloud 同步 / 系统更新偏慢，
        # 而日志里什么都看不出来。客户端 (yuelink) 侧本来有这条策略，但只在「订阅完全
        # 没有 nameserver-policy」时才写，而真实订阅总是自带，所以它从未生效。
        # icloud.com.cn / icloud-content.com.cn 是 GCBD/AIPO 承运的国内 iCloud 租户，
