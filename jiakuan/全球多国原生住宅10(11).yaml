# yuelink-reset-version: 20260522001
# 2026-06-08 现代化: 44 个 classical 文本 rule-provider → .mrs 二进制 (mihomo ≥1.18.7,
# 2024-07; 本模板仅发 meta/verge/flclash/nekobox/cmfa 现代内核 UA, 老客户端走 clash.yaml)。
# geodata 整包依赖 (geodata-mode/geox-url/GEOIP/geosite:) 已全部移除 —— GEOSITE 内核规则
# 反而要下整包 geosite.dat, .mrs 按需小文件才是 2026 主流 (MetaCubeX wiki 推荐)。
# 规则源 = 自建镜像 geo.yuetong.app (R2 yue-geo, 每 6 小时校验更新),
# 脱离 jsdelivr/GitHub 第三方 CDN。回滚: 模板 revision 归档 + R2 snapshots。

mixed-port: 7890
# allow-lan 默认关 (2026 主流默认; YueLink 客户端按用户设置 force-set 此键)。
# 第三方客户端直接导入订阅时也不再默认裸奔一个 LAN open proxy。
allow-lan: false
ipv6: true
log-level: info
tcp-concurrent: true
unified-delay: true
# 2026-06-01: keep-alive 60→15(对标 OpenClash overwrite + mihomo 默认)。idle 300s
# 后每 15s 探活, 防 NAT/GFW 中间设备 reap 空闲长连接(诊断实测 "no recent network
# activity" 空闲断流)。idle 仍 300 → 仅长时间空闲连接受影响, 手机电量代价可忽略。
keep-alive-interval: 15
keep-alive-idle: 300
# 2026-08-05: 兼容性保守值。这里控制的是客户端 mihomo/quic-go，不代表服务端
# yue-node 的运行时开关；服务端已启用 GSO，不能把两端状态写成“对称”。GSO 通常能
# 降低 Linux 发包开销，是否解除客户端禁用只能通过受控 Linux 金丝雀验证；ECN 仍因
# 复杂中间链路的兼容风险保持禁用。mihomo 支持这两个键，客户端 verbatim 透传。
experimental:
    # 2026-09-08: 回到上游 mihomo 默认 (false = 开 GSO)。此前的 true 是 2026-06 的
    # 保守基线，它对冲的两个缺陷 (PPPoE、system/mixed 栈) 已在 mihomo 1.19.21 修掉。
    # 只在 Linux 客户端有效 (quic-go 的 GSO 路径只为 GOOS=linux 编译)，失败自限:
    # 建 socket 时探测不到 UDP_SEGMENT 就不启用，发包撞 EIO/EINVAL 则该连接落闩并
    # 逐包重发。这里是这个值的唯一源头 —— 客户端只 ensure，不覆盖。
    quic-go-disable-gso: false
    quic-go-disable-ecn: true
profile:
    store-selected: true
    store-fake-ip: true
sniffer:
    enable: true
    # 2026-09-03: override-destination 全局/TLS/QUIC 改 false (mihomo docs/config.yaml 主流形态:
    # 仅 HTTP 段 true)。嗅探到的 SNI 仍用于规则匹配 (metadata.RuleHost 优先取 SniffHost),
    # 但不再丢掉客户端自己选定的目的 IP 去重新解析。此前 true 时, 真实 IP 流 (fake-ip-filter
    # 里的 +.cn / 银行 / OEM 域, 以及 HTTPDNS+IP 直连型 App: 美团/点评 Shark、淘宝、微信) 被
    # 改写域名后由 mihomo 二次解析再直连: 一台 OpenClash 路由器快照里 api.smoot.apple.cn 被
    # 解析到东京 AWS 再"直连", xhscdn/wechat.com/msn.cn 同样被改写 → "国内 App 慢"的另一半。
    override-destination: false
    # 2026-07-23 收口: parse-pure-ip/force-dns-mapping 显式 true 已删,回落 mihomo
    # 默认(false/true)。yuelink 实测两者全开 −30% 吞吐(ccfae5e);CVR 默认模板亦不设。
    force-domain:
        - "+.netflix.com"
        - "+.nflxvideo.net"
        - "+.nflximg.com"
        - "+.nflxext.com"
        - "+.nflxso.net"
        - "+.amazonaws.com"
        - "+.media.dssott.com"
        - "+.disney-plus.net"
        - "+.dssott.com"
    sniff:
        HTTP:
            ports: [80, 8080-8090]
            override-destination: true
        TLS:
            ports: [443, 8443]
            override-destination: false
        QUIC:
            ports: [443, 8443]
            override-destination: false
    skip-dst-address:
        - 91.108.4.0/22
        - 91.108.8.0/22
        - 91.108.12.0/22
        - 91.108.16.0/22
