    # 2026-07-28 韧性收口: bootstrap 不能只有 DoT(853) 一条腿 —— 校园网/酒店/企业
    # Wi-Fi 常整段封 853(华为平板现场日志实证: 223.5.5.5:853 / 223.6.6.6:853 全部
    # i/o timeout → doh.pub/dns.alidns.com 两个 DoH 域名 bootstrap 不出来 → 三条
    # nameserver 链全灭 → 节点域名解析不出, 整机断网)。default-nameserver 只解析
    # DoH provider 这两个中性域名, 明文竞速抢赢零用户信息泄漏; system = OS/DHCP
    # 解析器(mihomo 官方支持, config.go 对 default-nameserver 纯 IP 校验显式豁免
    # system), 覆盖"只放行本地 DNS"的管制网络。
    default-nameserver:
        - tls://223.5.5.5
        - tls://119.29.29.29
        - 223.5.5.5
        - 119.29.29.29
        - system
    nameserver:
        - "https://doh.pub/dns-query"
        - "https://dns.alidns.com/dns-query"
        # 2026-07-11 韧性: 与 proxy-server-nameserver 同款境内 DoT 兜底。CN/未分类域
        # 的解析只靠 DoH(443) 一条腿, DoH 被 ISP QoS 限速就全黑。DoT(tls://223.5.5.5,
        # 境内 853 不被墙、免 bootstrap、加密)并发竞速抢赢也无害(同为境内 AliDNS)。
        - "tls://223.5.5.5"
        - "tls://223.6.6.6"
        # 2026-07-28 韧性: 纯 IP 境内 DoH(443) —— 免 bootstrap、加密、不依赖 853。
        # 「853 被封 + UDP53 被劫持」的管制网络上是唯一活腿(IP 在证书 SAN 内, TLS
        # 校验照过; Ali 223.5.5.5 + 腾讯 120.53.53.53 跨 provider 冗余)。
        - "https://223.5.5.5/dns-query"
        - "https://120.53.53.53/dns-query"
    direct-nameserver:
        - "https://dns.alidns.com/dns-query"
        - "https://doh.pub/dns-query"
        # 2026-07-11 韧性: DIRECT/CN 域名解析同样不能只靠 DoH(443) 一条腿(限速则
        # 全黑)。加境内 DoT 兜底, 与 nameserver / proxy-server-nameserver 一致。
        - "tls://223.5.5.5"
        - "tls://223.6.6.6"
        # 2026-07-28 韧性: 纯 IP 境内 DoH(443), 免 bootstrap, 同 nameserver 注释。
        - "https://223.5.5.5/dns-query"
        - "https://120.53.53.53/dns-query"
    proxy-server-nameserver:
        - "https://dns.alidns.com/dns-query"
        - "https://doh.pub/dns-query"
        # 2026-07-09 韧性: 节点域名(*.yuetong.online/*.yuetoto.net)只靠 DoH 一条腿,
        # DoH(443)被 ISP QoS 限速就全队黑(节点 A 记录健康也解析不出)。加境内 DoT 兜底。
        # ⚠️ 只用 DoT 不用纯 UDP: mihomo 对 nameserver 列表并发竞速最快者赢(dns/util.go
        # batchExchange),纯 UDP 无握手会抢赢 → 节点域名明文泄露给 ISP,破坏抗测绘。
        # DoT 免 bootstrap 比 DoH 更快、加密、境内 853 不被墙,抢赢也无害。
        - "tls://223.5.5.5"
        - "tls://223.6.6.6"
        # 2026-07-28 韧性: 纯 IP 境内 DoH(443), 免 bootstrap、加密(无节点域名明文
        # 泄漏), 853 被封的网络上节点域名解析的唯一活腿。
        - "https://223.5.5.5/dns-query"
        - "https://120.53.53.53/dns-query"
    # 2026-06-08 防 DNS 泄露强化: 海外 DoH 改纯 IP (1.1.1.1 / 8.8.8.8 均在各自证书
    # SAN 内, TLS 校验照常通过)。原域名型 (cloudflare-dns.com/dns.google) 需先经
    # default-nameserver bootstrap 解析 → 多一跳, 且国内解析器能看到"你在查 dns.google"
