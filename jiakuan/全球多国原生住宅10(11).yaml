    cache-algorithm: arc # ARC>LRU 命中率,2026 主流
    listen: ":1053"
    enhanced-mode: "fake-ip"
    fake-ip-range: "198.18.0.1/16" # mihomo / Stash / sing-box 三端默认与 RFC 2544 标准；2026-05-21 audit 回退（mihomo 1.20 wiki 默认 /16，曾试 /15 但 third-party client 兼容性不足）
    fake-ip-filter-mode: "blacklist"
    prefer-h3: false
    respect-rules: true
    use-hosts: true
