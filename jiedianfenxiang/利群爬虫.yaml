base-loadbalance:
    empty-fallback: REJECT
    hidden: true
    include-all: true
    interval: 1800
    lazy: true
    max-failed-times: 3
    strategy: sticky-sessions
    timeout: 3000
    type: load-balance
    url: https://www.gstatic.com/generate_204
base-provider:
    header:
        User-Agent:
            - clash.meta/v1.19.29
            - clash-verge/v2.5.2
            - mihomo
    health-check:
        enable: true
        interval: 3600
        lazy: true
        url: https://www.gstatic.com/generate_204
    interval: 3600
    proxy: DIRECT
    type: http
base-ruleset-dn:
    behavior: domain
    format: mrs
    interval: 86400
    proxy: DIRECT
    type: http
base-ruleset-ip:
    behavior: ipcidr
    format: mrs
    interval: 86400
    proxy: DIRECT
    type: http
base-urltest:
    empty-fallback: REJECT
    hidden: true
    include-all: true
    interval: 1800
    lazy: true
    max-failed-times: 3
    timeout: 3000
    tolerance: 200
    type: url-test
    url: https://www.gstatic.com/generate_204
bind-address: '*'
