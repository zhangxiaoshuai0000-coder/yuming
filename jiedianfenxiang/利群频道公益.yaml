socks-port: 7892
tcp-concurrent: true
tproxy-port: 7894
tun:
    auto-detect-interface: true
    auto-redirect: true
    auto-route: true
    device: mihomo
    disable-icmp-forwarding: false
    dns-hijack:
        - any:53
        - tcp://any:53
    enable: false
    route-exclude-address-set:
        - cnip
        - privateip
    stack: mixed
    strict-route: true
unified-delay: true
urltest-first:
    proxies:
        - 自动选择
        - DIRECT
        - 手动选择
        - 负载均衡
        - 优选域名
        - 美国
        - 新加坡
        - 香港
        - 日本
        - 韩国
        - 马来西亚
        - 德国
        - 澳大利亚
        - 台湾省
        - 其他节点
    type: select
