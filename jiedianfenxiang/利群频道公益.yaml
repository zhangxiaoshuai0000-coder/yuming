dns:
    cache-algorithm: arc
    default-nameserver:
        - 223.5.5.5#DIRECT
        - 119.29.29.29#DIRECT
    direct-nameserver:
        - 223.6.6.6#DIRECT
        - 119.29.29.29#DIRECT
    direct-nameserver-follow-policy: true
    enable: true
    enhanced-mode: fake-ip
    fake-ip-filter:
        - rule-set:private
        - rule-set:fakeip-filter
        - rule-set:cn
        - rule-set:googlefcm
    fake-ip-range: 198.18.0.1/15
    fake-ip-range6: 2001:2::1/48
    ipv6: false
    listen: 0.0.0.0:1053
    nameserver:
        - https://dns.google/dns-query#DNS&ecs=223.5.5.0/24
        - https://doh.opendns.com/dns-query#DNS&ecs=223.5.5.0/24
        - https://cloudflare-dns.com/dns-query#DNS&ecs=223.5.5.0/24
    nameserver-policy:
        rule-set:private,fakeip-filter,cn,googlefcm:
            - 223.5.5.5#DIRECT
            - 119.29.29.29#DIRECT
    proxy-server-nameserver:
        - https://dns.alidns.com/dns-query#DIRECT
        - https://doh.pub/dns-query#DIRECT
    respect-rules: false
    use-hosts: true
