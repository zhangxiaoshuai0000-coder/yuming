    empty-fallback: REJECT
    hidden: true
    include-all: true
    interval: 1800
    lazy: true
    max-failed-times: 3
    strategy: sticky-sessions
    timeout: 3000
    type: load-balance
    url: https://www.gstatic.com/generate_204
