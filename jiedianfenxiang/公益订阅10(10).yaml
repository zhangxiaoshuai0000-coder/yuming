    - "RULE-SET,anthropic_domain,\U0001F916 AI"
    - "RULE-SET,gemini_domain,\U0001F916 AI"
    - RULE-SET,telegram_domain,✈️ Telegram
    - RULE-SET,telegram_ip,✈️ Telegram,no-resolve
    - RULE-SET,youtube_domain,▶️ YouTube
    - "RULE-SET,netflix_domain,\U0001F3AC Netflix"
    - "RULE-SET,netflix_ip,\U0001F3AC Netflix,no-resolve"
    - "RULE-SET,disney_domain,\U0001F3F0 Disney+"
    - "RULE-SET,tiktok_domain,\U0001F3B5 TikTok"
    - "RULE-SET,github_domain,\U0001F9D1‍\U0001F4BB GitHub"
    - "RULE-SET,google_domain,\U0001F50E Google"
    - "RULE-SET,microsoft_domain,\U0001FA9F Microsoft"
    - "RULE-SET,apple_domain,\U0001F34E Apple"
    - "RULE-SET,games_domain,\U0001F3AE Games"
    - RULE-SET,cn_domain,DIRECT
    - RULE-SET,cn_ip,DIRECT,no-resolve
    - "RULE-SET,geolocation_non_cn,\U0001F310 Global"
    - "MATCH,\U0001F3AF Final"
sniffer:
    enable: true
    force-dns-mapping: true
    override-destination: true
    parse-pure-ip: true
    skip-domain:
        - +.push.apple.com
    sniff:
        HTTP:
            ports:
                - 80
                - 8080-8880
        QUIC:
            ports:
                - 443
                - 8443
        TLS:
            ports:
                - 443
                - 8443
tcp-concurrent: true
tun:
    auto-detect-interface: true
    auto-redirect: true
    auto-route: true
    dns-hijack:
        - any:53
        - tcp://any:53
    enable: false
    stack: mixed
    strict-route: true
unified-delay: true
